name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Scoped to what the current unit tests need (tests/test_config.py
      # only touches stdlib via src/data_copilot/config.py, resolved through
      # pyproject.toml's [tool.pytest.ini_options] pythonpath), not the full
      # LangChain/Chroma stack in pyproject.toml's dependencies — keeps CI
      # fast and reliable. Expand as roadmap items add real functionality.
      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest -q
