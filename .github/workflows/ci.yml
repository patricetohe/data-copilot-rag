name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Scoped to what the current unit tests need: pytest, duckdb (sample
      # warehouse + schema introspection) and chromadb (schema doc
      # embeddings), not the full LangChain/LangGraph/FastAPI/Streamlit
      # stack in pyproject.toml's dependencies — keeps CI fast and
      # reliable. Expand as later roadmap items bring in real LLM/chain
      # usage.
      - name: Install test dependencies
        run: pip install pytest duckdb chromadb

      - name: Run unit tests
        run: pytest -q
