[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-copilot"
version = "0.1.0"
description = "Natural-language-to-SQL agent: RAG over schema docs + LangGraph self-correcting SQL generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain",
    "langgraph",
    "langchain-community",
    "chromadb",
    "duckdb",
    "sqlglot",
    "fastapi",
    "uvicorn",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
data-copilot = "data_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
